<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probador de WhatsApp Bot - Clinikdent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: #25D366;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        .chat-area {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #ECE5DD;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 10px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.user .message-bubble {
            background: #DCF8C6;
            border-bottom-right-radius: 0;
        }
        .message.bot .message-bubble {
            background: white;
            border-bottom-left-radius: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .input-area {
            padding: 20px;
            background: #F0F0F0;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #25D366;
        }
        button {
            padding: 12px 30px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #128C7E;
        }
        .quick-buttons {
            padding: 15px 20px;
            background: #F8F8F8;
            border-top: 1px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .quick-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #25D366;
            color: #25D366;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .quick-btn:hover {
            background: #25D366;
            color: white;
        }
        .loading {
            text-align: center;
            padding: 10px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦷 Clinikdent WhatsApp Bot</h1>
            <p>Prueba el asistente virtual</p>
        </div>
        
        <div class="quick-buttons">
            <button class="quick-btn" onclick="sendMessage('hola')">👋 Hola</button>
            <button class="quick-btn" onclick="sendMessage('1')">1️⃣ Registro</button>
            <button class="quick-btn" onclick="sendMessage('2')">2️⃣ Agendar Cita</button>
            <button class="quick-btn" onclick="sendMessage('3')">3️⃣ Mis Citas</button>
            <button class="quick-btn" onclick="sendMessage('4')">4️⃣ Servicios</button>
            <button class="quick-btn" onclick="sendMessage('5')">5️⃣ Soporte</button>
        </div>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Escribe un mensaje..." 
                onkeypress="if(event.key === 'Enter') sendMessage()"
            >
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/whatsapp/mensaje';
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage(quickMessage) {
            const message = quickMessage || messageInput.value.trim();
            if (!message) return;

            // Mostrar mensaje del usuario
            addMessage(message, true);
            messageInput.value = '';

            // Mostrar loading
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = 'Escribiendo...';
            chatArea.appendChild(loadingDiv);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        telefono: '3001234567',
                        nombre: 'Usuario Demo',
                        mensaje: message
                    })
                });

                loadingDiv.remove();

                if (!response.ok) {
                    throw new Error('Error en la respuesta');
                }

                const data = await response.json();
                
                if (data.success && data.respuesta) {
                    addMessage(data.respuesta, false);
                } else {
                    addMessage('Error: No se pudo procesar el mensaje', false);
                }

            } catch (error) {
                loadingDiv.remove();
                addMessage('❌ Error de conexión. Asegúrate de que el servidor esté corriendo en http://localhost:3001', false);
                console.error('Error:', error);
            }
        }

        // Mensaje inicial
        window.onload = () => {
            addMessage('¡Bienvenido! 👋 Escribe "hola" o presiona uno de los botones de arriba para comenzar.', false);
        };
    </script>
</body>
</html>
